<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta de Experiencia</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f7f4f0; /* Fondo beige cálido y elegante */
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #2c2c2c;
    }
    .card {
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 1px solid #eae5df;
    }
    h2 { 
      color: #6b2d5c; /* Vino tinto elegante */
      margin-bottom: 8px; 
      font-size: 22px;
      font-weight: 700;
    }
    .subtitle {
      font-size: 13px;
      color: #777;
      margin-bottom: 25px;
    }
    .step { display: none; }
    .step.active { display: block; }
    
    .question { 
      margin-bottom: 20px; 
      text-align: left; 
    }
    label { 
      display: block; 
      margin-bottom: 8px; 
      color: #444; 
      font-weight: 600; 
      font-size: 14px; 
    }
    
    select {
      width: 100%;
      padding: 12px 15px;
      border: 1.5px solid #dcd6cd;
      border-radius: 12px;
      background-color: #faf8f5;
      font-size: 14px;
      color: #333;
      outline: none;
      transition: all 0.3s ease;
    }
    select:focus { 
      border-color: #6b2d5c; 
    }

    .btn-main {
      background: linear-gradient(135deg, #6b2d5c 0%, #4a1e3f 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(107, 45, 92, 0.2);
      transition: transform 0.2s;
      margin-top: 10px;
      width: 100%;
    }
    .btn-main:active {
      transform: scale(0.98);
    }

    #timer {
      font-size: 19px;
      font-weight: 700;
      color: #6b2d5c;
      margin: 20px 0;
      line-height: 1.6;
      background: #fdf8f5;
      border: 1px solid #f0e6df;
      padding: 18px;
      border-radius: 16px;
    }

    /* Estilo para la primera foto */
    .photo-container {
      width: 100%;
      max-height: 250px;
      border-radius: 16px;
      overflow: hidden;
      margin-top: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      border: 1px solid #eee;
    }
    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- PANTALLA 1: Calificación (1 al 5) -->
    <div id="step1" class="step active">
      <h2>Encuesta de Experiencia 📝</h2>
      <p class="subtitle">(Califica del 1 al 5, donde 5 es muy satisfactorio)</p>
      
      <div class="question">
        <label>1. ¿Cómo calificas la experiencia de hoy?</label>
        <select>
          <option>5 - Muy satisfactorio</option>
          <option>4 - Excelente</option>
          <option>3 - Bueno</option>
          <option>2 - Regular</option>
          <option>1 - Deficiente</option>
        </select>
      </div>

      <div class="question">
        <label>2. ¿Qué tal te pareció la comida?</label>
        <select>
          <option>5 - Deliciosa / Muy satisfactorio</option>
          <option>4 - Muy buena</option>
          <option>3 - Aceptable</option>
          <option>2 - Regular</option>
          <option>1 - Mala</option>
        </select>
      </div>

      <div class="question">
        <label>3. ¿Qué tan interesante te pareció esta experiencia?</label>
        <select>
          <option>5 - Súper interesante / Muy satisfactorio</option>
          <option>4 - Bastante interesante</option>
          <option>3 - Normal</option>
          <option>2 - Un poco aburrida</option>
          <option>1 - Nada interesante</option>
        </select>
      </div>

      <button class="btn-main" onclick="nextStep(2)">Siguiente ➡️</button>
    </div>

    <!-- PANTALLA 2: Opciones Jocosas -->
    <div id="step2" class="step">
      <h2>Evaluación de Futuro 🤔</h2>
      <p class="subtitle">Sinceridad ante todo</p>

      <div class="question">
        <label>1. ¿Repetirías esta experiencia?</label>
        <select>
          <option>Sí</option>
          <option>Definitivamente sí</option>
        </select>
      </div>

      <div class="question">
        <label>2. ¿Consideras que deberíamos seguir haciendo planes como los de hoy?</label>
        <select>
          <option>Sí</option>
          <option>Sí, pero yo lo quiero organizar</option>
        </select>
      </div>

      <div class="question">
        <label>3. ¿Quieres continuar seriamente con esta experiencia o aventura?</label>
        <select id="p3_answer">
          <option value="si">Sí</option>
          <option value="que_significa">¿Qué significa esto?</option>
        </select>
      </div>

      <button class="btn-main" onclick="nextStep(3)">Siguiente ➡️</button>
    </div>

    <!-- PANTALLA 3: La Pregunta Directa -->
    <div id="step3" class="step">
      <h2>Llegamos al punto importante... 😳❤️</h2>
      <p style="font-size: 18px; color: #444; margin: 30px 0 20px 0; font-weight: 500;">¿Quieres ser mi novio?</p>
      
      <button class="btn-main" onclick="acceptProposal()">¡SÍ! 🥰</button>
    </div>

    <!-- PANTALLA 4: Contador Infinito + Foto al final -->
    <div id="step4" class="step">
      <h2>¡Oficialmente Novios! 🎉❤️</h2>
      
      <p style="color: #666; font-size: 14px; margin-top: 10px;">Llevamos juntos exactamente:</p>
      <div id="timer">Cargando tiempo...</div>

      <!-- Primera foto guardada -->
      <div class="photo-container">
        <img src="foto.jpg" alt="Nuestra primera foto" onerror="this.style.display='none'">
      </div>
    </div>

  </div>

  <script>
    function nextStep(stepNumber) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById('step' + stepNumber).classList.add('active');
    }

    function acceptProposal() {
      if (!localStorage.getItem('startDate')) {
        localStorage.setItem('startDate', new Date().getTime());
      }
      nextStep(4);
      startTimer();
    }

    function startTimer() {
      const startDate = parseInt(localStorage.getItem('startDate'));
      
      setInterval(() => {
        const now = new Date().getTime();
        const difference = now - startDate;

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById('timer').innerHTML = 
          `<b>${days}</b> días, <b>${hours}</b> hs,<br><b>${minutes}</b> min y <b>${seconds}</b> seg`;
      }, 1000);
    }

    window.onload = function() {
      if (localStorage.getItem('startDate')) {
        nextStep(4);
        startTimer();
      }
    };
  </script>
</body>
</html>
