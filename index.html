<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta de Satisfacción</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    h2 { color: #d63384; margin-bottom: 20px; font-size: 22px; }
    .step { display: none; }
    .step.active { display: block; }
    
    .question { margin-bottom: 22px; text-align: left; }
    label { display: block; margin-bottom: 8px; color: #444; font-weight: 600; font-size: 14px; }
    
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background-color: #f9f9f9;
      font-size: 14px;
      color: #333;
      outline: none;
    }
    select:focus { border-color: #d63384; }

    .btn-main {
      background-color: #d63384;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 15px;
      width: 100%;
    }
    .btn-main:hover { background-color: #b8226c; }

    .proposal-btns {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    #timer {
      font-size: 20px;
      font-weight: bold;
      color: #d63384;
      margin-top: 20px;
      line-height: 1.6;
      background: #fff0f6;
      padding: 15px;
      border-radius: 12px;
      border: 1px dashed #d63384;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- PANTALLA 1: Calificación (1 al 5) -->
    <div id="step1" class="step active">
      <h2>Encuesta de Experiencia 📝</h2>
      <p style="font-size: 13px; color: #666; margin-bottom: 20px;">(Califica del 1 al 5, donde 5 es muy satisfactorio)</p>
      
      <div class="question">
        <label>1. ¿Cómo calificas la experiencia de hoy?</label>
        <select id="p1">
          <option value="5">5 - Muy satisfactorio</option>
          <option value="4">4 - Excelente</option>
          <option value="3">3 - Bueno</option>
          <option value="2">2 - Regular</option>
          <option value="1">1 - Deficiente</option>
        </select>
      </div>

      <div class="question">
        <label>2. ¿Qué tal te pareció la comida?</label>
        <select id="p2">
          <option value="5">5 - Deliciosa / Muy satisfactorio</option>
          <option value="4">4 - Muy buena</option>
          <option value="3">3 - Aceptable</option>
          <option value="2">2 - Regular</option>
          <option value="1">1 - Mala</option>
        </select>
      </div>

      <div class="question">
        <label>3. ¿Qué tan interesante te pareció esta experiencia?</label>
        <select id="p3">
          <option value="5">5 - Súper interesante / Muy satisfactorio</option>
          <option value="4">4 - Bastante interesante</option>
          <option value="3">3 - Normal</option>
          <option value="2">2 - Un poco aburrida</option>
          <option value="1">1 - Nada interesante</option>
        </select>
      </div>

      <button class="btn-main" onclick="nextStep(2)">Siguiente ➡️</button>
    </div>

    <!-- PANTALLA 2: Opciones Jocosas -->
    <div id="step2" class="step">
      <h2>Evaluación de Futuro 🤔</h2>

      <div class="question">
        <label>1. ¿Repetirías esta experiencia?</label>
        <select>
          <option>Sí</option>
          <option>Definitivamente sí</option>
        </select>
      </div>

      <div class="question">
        <label>2. ¿Consideras que deberíamos seguir haciendo planes como los de hoy?</label>
        <select>
          <option>Sí</option>
          <option>Sí, pero yo lo quiero organizar</option>
        </select>
      </div>

      <div class="question">
        <label>3. ¿Quieres continuar seriamente con esta experiencia o aventura?</label>
        <select id="p6">
          <option value="si">Sí</option>
          <option value="que_significa">¿Qué significa esto?</option>
        </select>
      </div>

      <button class="btn-main" onclick="handleStep2Next()">Siguiente ➡️</button>
    </div>

    <!-- PANTALLA 3: La Pregunta Directa -->
    <div id="step3" class="step">
      <h2>Llegamos al punto importante... 😳❤️</h2>
      <p style="font-size: 18px; color: #333; margin: 25px 0;">¿Quieres ser mi novio?</p>
      
      <div class="proposal-btns">
        <button class="btn-main" onclick="acceptProposal()">¡SÍ! 🥰</button>
      </div>
    </div>

    <!-- PANTALLA 4: Contador Infinito -->
    <div id="step4" class="step">
      <h2>¡Oficialmente Novios! 🎉❤️</h2>
      <p style="color: #555;">Llevamos juntos exactamente:</p>
      <div id="timer">Cargando tiempo...</div>
    </div>

  </div>

  <script>
    function nextStep(stepNumber) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById('step' + stepNumber).classList.add('active');
    }

    function handleStep2Next() {
      const q3Value = document.getElementById('p6').value;
      // Tanto si elige "Sí" como si elige "¿Qué significa esto?", lo llevamos a la pantalla 3 de la propuesta
      nextStep(3);
    }

    function acceptProposal() {
      // Guardar la fecha exacta en la memoria del navegador del usuario
      if (!localStorage.getItem('startDate')) {
        localStorage.setItem('startDate', new Date().getTime());
      }
      nextStep(4);
      startTimer();
    }

    function startTimer() {
      const startDate = parseInt(localStorage.getItem('startDate'));
      
      setInterval(() => {
        const now = new Date().getTime();
        const difference = now - startDate;

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById('timer').innerHTML = 
          `<b>${days}</b> días, <b>${hours}</b> horas,<br><b>${minutes}</b> minutos y <b>${seconds}</b> segundos`;
      }, 1000);
    }

    // Verificar si ya aceptó previamente para llevarlo directamente al contador
    window.onload = function() {
      if (localStorage.getItem('startDate')) {
        nextStep(4);
        startTimer();
      }
    };
  </script>
</body>
</html>
